<header class="barra">
  <a class="marca" routerLink="/contratos">
    <span class="marca__nombre">ASOCIM</span>
    <span class="marca__area">Contratos</span>
  </a>
  @if (sesion.usuario(); as usuario) {
    <div class="barra__usuario">
      @if (usuario.rol === 'ADMIN') {
        <a mat-button routerLink="/usuarios" class="barra__enlace">Personas</a>
        <a mat-button routerLink="/registro" class="barra__enlace">Registro</a>
      }
      <span class="barra__nombre">{{ usuario.nombre }}</span>
      <button mat-button type="button" (click)="salir()">Salir</button>
    </div>
  }
</header>

<main class="contenido">
  <router-outlet />
</main>
